name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check services tests mcp-servers benchmark scripts
      - run: uv run pytest -q
        env:
          PYTHONPATH: services/orchestrator:services:.
      - run: uv run python benchmark/run_bench.py --seed 42
      - name: pip-audit
        run: uv pip install pip-audit && uv run pip-audit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f services/orchestrator/Dockerfile .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile apps/web

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate
      - name: terraform test (mocked providers, offline)
        run: terraform test
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.66.0
      - name: tflint
        run: |
          tflint --init
          tflint --format compact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: checkov (soft-fail)
        run: |
          pip install --quiet checkov
          checkov -d . --config-file .checkov.yaml --compact --quiet --soft-fail

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --extra dev
      - run: npm ci --legacy-peer-deps
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start API
        run: |
          uv run uvicorn app.main:app --app-dir services/orchestrator --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 2
          done
          echo "API failed to become healthy" >&2
          exit 1
        env:
          PYTHONPATH: services/orchestrator:services:.
          RABT_DB: /tmp/rabt-e2e.db
      - name: Start web
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 2
          done
          echo "Web failed to become ready" >&2
          exit 1
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      - run: npx playwright test
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      - name: i18n coverage
        if: always()
        run: |
          if [ -f test-results/i18n-coverage.json ]; then
            echo "### i18n coverage (patient: 7 locales, staff: Arabic)" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat test-results/i18n-coverage.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14
