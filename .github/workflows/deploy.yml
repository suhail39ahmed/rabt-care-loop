name: deploy

# Builds the API and web images, pushes them to Azure Container Registry and rolls them out to
# Azure Container Apps as a service principal with a client secret; runs in the `pilot` environment.
# Configuration is repository SECRETS only (AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID). Skipped while the secrets are missing; if the infra is not applied yet
# (no registry), the job exits early with a notice instead of failing.

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "apps/web/**"
      - "data/**"
      - "benchmark/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pilot
  cancel-in-progress: false

env:
  # Names follow infra/terraform naming (name_suffix = "").
  RESOURCE_GROUP: rg-rabt-pilot-sea
  ACR_NAME: crrabtpilotsea
  API_APP: ca-rabt-api-pilot
  WEB_APP: ca-rabt-web-pilot
  INGEST_JOB: caj-rabt-ingest-pilot
  INSURER_APP: ca-rabt-insurer-pilot

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        # Only checks that the secrets exist; their values are never printed.
        env:
          HAS_CLIENT: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_TENANT: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}
        run: |
          if [ "$HAS_CLIENT$HAS_SECRET$HAS_TENANT$HAS_SUB" = "truetruetruetrue" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add the AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID repository secrets."
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Check the infra exists
        id: infra
        run: |
          az extension add --name containerapp --upgrade --yes --only-show-errors
          if az acr show -n "$ACR_NAME" -o none 2>/dev/null && az containerapp show -n "$API_APP" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::$ACR_NAME / $API_APP not found. Run the infra workflow (apply) first."
          fi

      - name: Prepare
        if: steps.infra.outputs.ready == 'true'
        run: |
          az acr login --name "$ACR_NAME"
          echo "REGISTRY=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build and push API image
        if: steps.infra.outputs.ready == 'true'
        run: |
          docker build -f services/orchestrator/Dockerfile -t "$REGISTRY/rabt-api:$TAG" .
          docker push "$REGISTRY/rabt-api:$TAG"

      - name: Roll out API
        if: steps.infra.outputs.ready == 'true'
        run: |
          az containerapp update -n "$API_APP" -g "$RESOURCE_GROUP" --image "$REGISTRY/rabt-api:$TAG" --only-show-errors -o none
          az containerapp ingress update -n "$API_APP" -g "$RESOURCE_GROUP" --target-port 8000 --only-show-errors -o none
          echo "API_URL=https://$(az containerapp show -n "$API_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_ENV"
          echo "WEB_URL=https://$(az containerapp show -n "$WEB_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_ENV"

      - name: Roll out demo insurer agent
        if: steps.infra.outputs.ready == 'true'
        run: |
          if az containerapp show -n "$INSURER_APP" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            az containerapp update -n "$INSURER_APP" -g "$RESOURCE_GROUP" --image "$REGISTRY/rabt-api:$TAG" --only-show-errors -o none
            az containerapp ingress update -n "$INSURER_APP" -g "$RESOURCE_GROUP" --target-port 8000 --only-show-errors -o none
          else
            echo "::notice::No insurer app $INSURER_APP (enable_insurer_demo = false); the API uses the in-process insurer."
          fi

      - name: Roll out KB ingestion job and index the approved KB
        if: steps.infra.outputs.ready == 'true'
        run: |
          if az containerapp job show -n "$INGEST_JOB" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            az containerapp job update -n "$INGEST_JOB" -g "$RESOURCE_GROUP" --image "$REGISTRY/rabt-api:$TAG" --only-show-errors -o none
            az containerapp job start -n "$INGEST_JOB" -g "$RESOURCE_GROUP" --only-show-errors -o none
            echo "Ingestion job $INGEST_JOB updated and started." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::No ingestion job $INGEST_JOB (enable_kb_ingest_job = false); skipping."
          fi

      - name: Build and push web image
        if: steps.infra.outputs.ready == 'true'
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="$API_URL" \
            --build-arg NEXT_PUBLIC_SITE_URL="$WEB_URL" \
            -t "$REGISTRY/rabt-web:$TAG" apps/web
          docker push "$REGISTRY/rabt-web:$TAG"

      - name: Roll out web
        if: steps.infra.outputs.ready == 'true'
        run: |
          az containerapp update -n "$WEB_APP" -g "$RESOURCE_GROUP" --image "$REGISTRY/rabt-web:$TAG" --only-show-errors -o none
          az containerapp ingress update -n "$WEB_APP" -g "$RESOURCE_GROUP" --target-port 3000 --only-show-errors -o none

      - name: Smoke test
        if: steps.infra.outputs.ready == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/healthz" > /tmp/health.json; then break; fi
            sleep 10
          done
          cat /tmp/health.json
          curl -fsS -o /dev/null "$WEB_URL/"
          curl -fsS -o /dev/null "$WEB_URL/board"

      - name: Summary
        if: steps.infra.outputs.ready == 'true'
        run: |
          {
            echo "### Deployed \`$TAG\`"
            echo "- Web: $WEB_URL"
            echo "- API: $API_URL ([docs]($API_URL/docs), [health]($API_URL/healthz))"
          } >> "$GITHUB_STEP_SUMMARY"
