name: infra

# Terraform for the Azure stack (infra/terraform), authenticated as a service principal with a client secret.
#   pull_request -> plan (posted to the job summary)
#   push to main / manual dispatch -> plan + apply in the `pilot` environment (protect it with required reviewers)
# Configuration is GitHub repository SECRETS only (no repository variables). Every Azure job is skipped until
# these secrets exist, so main stays green before Azure is set up:
#   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   APIM_PUBLISHER_EMAIL, BUDGET_CONTACT_EMAILS (JSON list, e.g. ["you@example.com"])
#   optional overrides: TF_STATE_RESOURCE_GROUP, TF_STATE_STORAGE_ACCOUNT, TF_STATE_CONTAINER, TF_STATE_KEY

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan only, or plan and apply"
        type: choice
        options: [plan, apply]
        default: plan
      import_existing:
        description: "adopt the hand-created pilot RG, APIM, Log Analytics, VNet and ACR into state (imports.tf)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: infra-pilot
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_apim_publisher_email: ${{ secrets.APIM_PUBLISHER_EMAIL }}
  TF_VAR_budget_contact_emails: ${{ secrets.BUDGET_CONTACT_EMAILS }}
  STATE_RG: ${{ secrets.TF_STATE_RESOURCE_GROUP || 'rg-rabt-tfstate-sea' }}
  STATE_SA: ${{ secrets.TF_STATE_STORAGE_ACCOUNT || 'strabttfstatesea' }}
  STATE_CONTAINER: ${{ secrets.TF_STATE_CONTAINER || 'tfstate' }}
  STATE_KEY: ${{ secrets.TF_STATE_KEY || 'rabt/pilot.tfstate' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        # Only checks that the secrets exist; their values are never printed.
        env:
          HAS_CLIENT: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_TENANT: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}
          HAS_EMAIL: ${{ secrets.APIM_PUBLISHER_EMAIL != '' }}
          HAS_EMAILS: ${{ secrets.BUDGET_CONTACT_EMAILS != '' }}
        run: |
          if [ "$HAS_CLIENT$HAS_SECRET$HAS_TENANT$HAS_SUB$HAS_EMAIL$HAS_EMAILS" = "truetruetruetruetruetrue" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Azure not configured::Add the repository secrets AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, APIM_PUBLISHER_EMAIL and BUDGET_CONTACT_EMAILS to enable Terraform plan/apply."
          fi

  plan:
    needs: gate
    if: needs.gate.outputs.configured == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform init (remote state)
        run: |
          terraform init \
            -backend-config="resource_group_name=$STATE_RG" \
            -backend-config="storage_account_name=$STATE_SA" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="use_azuread_auth=true"
      - name: terraform plan
        run: terraform plan -lock=false -var-file=environments/pilot.tfvars -out tfplan -no-color
      - name: Plan summary
        if: always()
        run: |
          {
            echo "### Terraform plan (pilot)"
            echo '```'
            terraform show -no-color tfplan 2>/dev/null | grep -E '^(Plan:|No changes|  # )' | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: gate
    if: needs.gate.outputs.configured == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # First apply creates APIM (Developer tier takes 30-90 minutes).
    timeout-minutes: 150
    environment: pilot
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform init (remote state)
        run: |
          terraform init \
            -backend-config="resource_group_name=$STATE_RG" \
            -backend-config="storage_account_name=$STATE_SA" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="use_azuread_auth=true"
      - name: terraform plan
        env:
          TF_VAR_import_existing: ${{ inputs.import_existing && 'true' || 'false' }}
        run: terraform plan -lock-timeout=10m -var-file=environments/pilot.tfvars -out tfplan -no-color
      - name: terraform apply
        if: github.event_name == 'push' || inputs.action == 'apply'
        run: terraform apply -lock-timeout=10m -auto-approve tfplan
      - name: Outputs summary
        if: github.event_name == 'push' || inputs.action == 'apply'
        run: |
          {
            echo "### Rabt pilot on Azure"
            echo "- Resource group: \`$(terraform output -raw resource_group_name)\`"
            echo "- APIM gateway: $(terraform output -raw apim_gateway_url)"
            echo "- API: $(terraform output -raw api_url)"
            echo "- Web: $(terraform output -raw web_url)"
            echo "- Registry: \`$(terraform output -raw acr_login_server)\`"
          } >> "$GITHUB_STEP_SUMMARY"
