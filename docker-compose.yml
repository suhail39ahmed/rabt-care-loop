services:
  api:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      RABT_DB: /tmp/rabt.db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    # Single replica — startup reseeds SQLite

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    depends_on:
      - api

  hapi:
    image: hapiproject/hapi:v7.4.0
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.subscription.resthook_enabled: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rabt
      POSTGRES_PASSWORD: rabt
      POSTGRES_DB: rabt
    ports:
      - "5432:5432"
    volumes:
      - rabt_pg:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"

  jaeger:
    image: jaegertracing/all-in-one:1.62
    ports:
      - "16686:16686"
      - "4317:4317"

volumes:
  rabt_pg:
